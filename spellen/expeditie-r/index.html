<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expeditie ℝ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#e8f0f3; --card:#ffffff; --ink:#15314a; --ink-soft:#4e6879; --line:#d5e2e6; --soft:#dfeaee;
  --accent:#2f8f8a; --accent-ink:#ffffff; --gold:#f2a516; --gold-ink:#5a3a00;
  --pos:#2b8f5c; --pos-bg:#e3f4ea; --neg:#cf4a3f; --neg-bg:#fbe7e4; --lock:#9fb0b8;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1d29; --card:#142a3b; --ink:#e5f0f4; --ink-soft:#9fb7c4; --line:#24435a; --soft:#1b3547;
  --accent:#4fc0b8; --accent-ink:#06201e; --gold:#ffb733; --gold-ink:#3a2500;
  --pos:#4cc489; --pos-bg:#143a2b; --neg:#ff7b6e; --neg-bg:#41201f; --lock:#4d6574; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1d29; --card:#142a3b; --ink:#e5f0f4; --ink-soft:#9fb7c4; --line:#24435a; --soft:#1b3547;
  --accent:#4fc0b8; --accent-ink:#06201e; --gold:#ffb733; --gold-ink:#3a2500;
  --pos:#4cc489; --pos-bg:#143a2b; --neg:#ff7b6e; --neg-bg:#41201f; --lock:#4d6574; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding:16px 16px 40px}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1.1;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.gold{background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-soft)}
.hero h1{font-size:clamp(2.4rem,9vw,4rem)}
.hero h1 .q{color:var(--accent)}
.field{display:grid;gap:6px}
.field input{font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);max-width:340px;width:100%}
/* breuken */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.15}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.par{font-size:1.9em;vertical-align:middle;font-weight:300;line-height:1}
sup{font-size:.7em}
.sqrt{font-size:1.6em;vertical-align:middle}
.rad{border-top:2px solid currentColor;display:inline-block;padding-top:2px}
/* vraag */
.qtext{font-size:1.25rem;line-height:1.9}
.axis{color:var(--ink);margin-top:8px}
.axis svg{width:100%;height:auto;display:block}
.answer{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.answer input{font:inherit;font-size:1.2rem;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:180px}
.unit{font-weight:700;font-size:1.2rem}
.hint{font-size:.85rem;color:var(--ink-soft);margin-top:6px}
.mc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.mc button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;font-size:1.15rem;min-height:64px}
.mc button:hover{border-color:var(--accent)}
.mc button.good{border-color:var(--pos);background:var(--pos-bg)}
.mc button.bad{border-color:var(--neg);background:var(--neg-bg)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--pos-bg);border-left:5px solid var(--pos)}
.fb.no{background:var(--neg-bg);border-left:5px solid var(--neg)}
.fb .sol{font-size:1.1rem;line-height:1.9}
.fb .tip{font-size:.9rem;color:var(--ink-soft)}
.progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .3s}
.dots{display:flex;gap:6px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.dots span.ok{background:var(--pos);border-color:var(--pos)}
.dots span.no{background:var(--neg);border-color:var(--neg)}
.tipbox{border-left:4px solid var(--gold);padding:10px 14px;background:color-mix(in srgb,var(--gold) 12%,var(--card));border-radius:0 10px 10px 0}
table{border-collapse:collapse;width:100%}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.85rem;color:var(--ink-soft)}

.path{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.step span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);background:var(--soft);color:var(--ink-soft);border:2px solid var(--line)}
.step small{font-size:.62rem;text-align:center;color:var(--ink-soft);line-height:1.15;overflow-wrap:anywhere}
.step.done span{background:var(--pos);border-color:var(--pos);color:#fff}
.step.cur span{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);transform:scale(1.15)}
.step.lock span{opacity:.6}
@media (max-width:560px){.path{grid-template-columns:repeat(7,1fr)}.step small{display:none}}
/* reële getallen */
.fr.sm{font-size:.85em;margin:0 .05em;line-height:1.05}
.fr.sm>span:first-child{border-bottom-width:1.5px}
.root{white-space:nowrap;display:inline-flex;align-items:flex-end;vertical-align:baseline}
.root .sqrt{font-size:1.25em;line-height:1;vertical-align:baseline;margin-right:-.04em}
.root .rad{border-top:.09em solid currentColor;padding:.06em .12em 0 .08em;line-height:1.15;margin-bottom:.08em}
.ri{font-size:.55em;position:relative;top:-1.05em;margin-right:-.5em;line-height:1}
.big{font-size:1.6rem;margin-top:8px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<footer style="max-width:760px;margin:24px auto 0;font-size:.8rem;color:var(--ink-soft);text-align:center">Wiskunde 7VJHO · De Resonant · G. Walschap</footer>
<script src="../../js/config.js?v=2" charset="utf-8"></script>
<script src="../../js/kern/api.js?v=5" charset="utf-8"></script>
<script src="../../js/kern/demo.js?v=8" charset="utf-8"></script>
<script src="../../js/spellen.js?v=4" charset="utf-8"></script>
<script src="../spel-volg.js?v=1" charset="utf-8"></script> <!-- leerpaden: aanmelding, voortgang en speeltijd -->
<script>
/* ===== Vraag-engine reële getallen (7VJHO, hoofdstuk 4) ===== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const red = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; };
const MIN = "−";
const sgn = n => (n < 0 ? MIN + Math.abs(n) : String(n));
const com = s => String(s).replace(".", ",");
const fx = (v, k) => com(v.toFixed(k)).replace("-", MIN);
const uniqBy = arr => arr.filter((x, i, a) => a.indexOf(x) === i);

/* ---- notatie ---- */
function F(n, d) {
  if (d === undefined || d === 1) return `<span class="num">${sgn(n)}</span>`;
  const neg = (n < 0) !== (d < 0);
  return `${neg ? '<span class="num">' + MIN + "</span>" : ""}<span class="fr"><span>${Math.abs(n)}</span><span>${Math.abs(d)}</span></span>`;
}
const Fraw = (t, b) => `<span class="fr"><span>${t}</span><span>${b}</span></span>`;
const pw = (base, e) => `${base}<sup>${String(e).replace("-", MIN)}</sup>`;
const par = h => `<span class="par">(</span>${h}<span class="par">)</span>`;
/* wortel: n = wortelexponent (leeg of 2 = vierkantswortel) */
const RT = (x, n) => `<span class="root">${n && n !== 2 ? `<sup class="ri">${n}</sup>` : ""}<span class="sqrt">√</span><span class="rad">${x}</span></span>`;
const SQ = x => RT(x);
/* macht met breuk als exponent */
const PF = (base, m, n) => `${base}<sup><span class="fr sm"><span>${String(m).replace("-", MIN)}</span><span>${n}</span></span></sup>`;
const LOG = (b, r) => `log${b === 10 || b === "" ? "" : `<sub>${b}</sub>`} ${r}`;
const coefRoot = (k, m) => (k === 1 ? "" : k === -1 ? MIN : sgn(k)) + SQ(m);
const IV = (a, ai, b, bi) => `${ai ? "[" : "]"}${a === null ? MIN + "∞" : sgn(a)} ; ${b === null ? "+∞" : sgn(b)}${bi ? "]" : "["}`;

/* ---- invoer lezen ---- */
const clean = s => String(s).trim().replace(/−/g, "-").replace(/\s+/g, "");
function parseFrac(s) { const m = clean(s).match(/^(-?\d+)(?:\/(-?\d+))?$/); if (!m) return null; const n = +m[1], d = m[2] === undefined ? 1 : +m[2]; if (d === 0) return null; return [n, d]; }
function parseNum(s) { const t = clean(s).replace(/[%€]/g, "").replace(",", "."); if (!/^-?\d+(\.\d+)?$/.test(t)) return null; return parseFloat(t); }

/* ---- vraagtypes ---- */
function qFrac(sec, q, n, d, sol, tip) {
  const [rn, rd] = red(n, d);
  return { sec, q, kind: "frac", ans: rd === 1 ? String(rn) : rn + "/" + rd, hint: "Typ een breuk zoals 3/4 of een geheel getal.", tip, sol: sol || F(rn, rd),
    check(inp) {
      const p = parseFrac(inp); if (!p) return { ok: false, msg: "Typ je antwoord als breuk, bv. 3/4." };
      const [a, b] = p; if (a * rd !== rn * b) return { ok: false };
      const [sa, sb] = red(a, b);
      if (sa !== a * Math.sign(b) || sb !== Math.abs(b)) return { ok: false, msg: "De waarde klopt, maar vereenvoudig je breuk nog." };
      return { ok: true };
    } };
}
// getal; dec = gevraagd aantal decimalen (dan tolerantie van een afronding)
function qNum(sec, q, val, sol, tip, dec = null, unit = "") {
  const tol = dec === null ? 1e-9 : 0.5 * 10 ** -dec + 1e-9;
  const hint = dec === null ? "Typ een getal, gebruik een komma voor decimalen." : `Typ een getal, afgerond op ${dec} decima${dec === 1 ? "al" : "len"}.`;
  return { sec, q, kind: "num", unit, ans: dec === null ? com(+val.toFixed(6)) : fx(val, dec), hint, tip, sol,
    check(inp) { const v = parseNum(inp); if (v === null) return { ok: false, msg: "Typ een getal." };
      if (Math.abs(v - val) > tol) return { ok: false };
      if (dec !== null) { const t = clean(inp).replace(",", "."); const dd = (t.split(".")[1] || "").length; if (dd > dec) return { ok: false, msg: `Rond af op ${dec} decima${dec === 1 ? "al" : "len"}.` }; }
      return { ok: true }; } };
}
function qMC(sec, q, opts, correct, sol, tip) {
  const order = shuffle(opts.map((o, i) => i));
  return { sec, q, kind: "mc", opts: order.map(i => opts[i]), correctIdx: order.indexOf(correct), tip, sol: sol || opts[correct], check: i => ({ ok: i === order.indexOf(correct) }) };
}
/* MC met automatisch ontdubbelde afleiders (eerste = juist) */
function qMCu(sec, q, good, wrong, sol, tip, n = 4) {
  const opts = uniqBy([good, ...shuffle(wrong)]).slice(0, n);
  return qMC(sec, q, opts, 0, sol || good, tip);
}

/* ---- onderdelen ---- */
const SECTIONS = [
  { id: 1, t: "Reële getallen", s: "rationaal of irrationaal", tip: "Rationaal (ℚ): begrensd of repeterend. Irrationaal (ℝ \\ ℚ): niet begrensd én niet repeterend, bv. π en √2. ℝ = ℚ ∪ (ℝ \\ ℚ). ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ." },
  { id: 2, t: "Bewerkingen in ℝ", s: "derdemachtswortels en benaderen", tip: "∛8 = 2 want 2³ = 8, ∛−8 = −2 want (−2)³ = −8. Op de rekenmachine: ∛x = x^(1÷3). Benader een wortel tussen gekende kwadraten of derdemachten. Rond pas op het einde af." },
  { id: 3, t: "Zonder rekenmachine", s: "wortels vereenvoudigen en rekenen", tip: "√(a·b) = √a·√b, √a·√a = a. Vereenvoudigen: zoek het grootste gekende kwadraat (√12 = 2√3). Enkel gelijksoortige wortels optellen (3√2 + 5√2 = 8√2). Noemer wortelvrij: a/√b = a√b/b." },
  { id: 4, t: "Intervallen", s: "haakjes, ongelijkheden, getallenas", tip: "Haakje naar binnen [ ] → het grensgetal hoort erbij (≤, ≥). Haakje naar buiten ] [ → het grensgetal hoort er niet bij (<, >). Bij +∞ en −∞ staat het haakje altijd naar buiten." },
  { id: 5, t: "Rationale exponenten", s: "wortelvorm en rekenregels", tip: "x^(m/n) = ⁿ√(xᵐ): de noemer wordt de wortelexponent, de teller de exponent onder de wortel. Rekenregels: aᵐ·aⁿ = aᵐ⁺ⁿ, aᵐ:aⁿ = aᵐ⁻ⁿ, (aᵐ)ⁿ = aᵐ·ⁿ." },
  { id: 6, t: "De logaritme", s: "definitie en intuïtief rekenen", tip: "logₐ r = n als aⁿ = r: hoeveel keer moet je a met zichzelf vermenigvuldigen om r te krijgen? Zonder grondtal is het grondtal 10." },
  { id: 7, t: "Rekenregels logaritmen", s: "som, verschil, macht", tip: "logₓ 1 = 0, logₓ x = 1, logₓ(m·n) = logₓ m + logₓ n, logₓ(m/n) = logₓ m − logₓ n, logₓ mⁿ = n·logₓ m, logₓ(1/n) = −logₓ n." },
  { id: 8, t: "Pythagoras", s: "zijden, rechthoekig?, afstand", tip: "a² + b² = c² (c = schuine zijde, de langste). Schuine zijde: c = √(a² + b²). Rechthoekszijde: b = √(c² − a²). Afstand AB = √((x₂ − x₁)² + (y₂ − y₁)²)." },
  { id: 9, t: "Vergelijkingen", s: "oplossen en de proef maken", tip: "Beide leden: dezelfde eenterm optellen/aftrekken, met hetzelfde getal (≠ 0) vermenigvuldigen/delen. Stappenplan: noemer wegwerken, wortel wegwerken, oplossen, proef." },
  { id: 10, t: "Omvormen van formules", s: "een grootheid afzonderen", tip: "Staat de gevraagde grootheid rechts? Verwissel de leden. Duid de grootheid aan en pas de regels van het oplossen van vergelijkingen toe." },
];
const TIP = id => SECTIONS[id - 1].tip;
const SQUARES = [1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144];
const isSq = n => Number.isInteger(Math.sqrt(n));

/* getallenas met haakjes (a/b = null → oneindig) */
function ivSVG(a, ai, b, bi, lo = -5, hi = 5) {
  const W = 560, H = 86, x0 = 28, x1 = W - 28, u = (x1 - x0) / (hi - lo), X = v => x0 + (v - lo) * u;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="getallenas"><line x1="${x0 - 14}" y1="38" x2="${x1 + 14}" y2="38" stroke="currentColor" stroke-width="2"/><path d="M${x1 + 16} 38 l-9 -5 v10z" fill="currentColor"/>`;
  for (let k = lo; k <= hi; k++) s += `<line x1="${X(k)}" y1="32" x2="${X(k)}" y2="44" stroke="currentColor" stroke-width="2"/><text x="${X(k)}" y="70" text-anchor="middle" font-size="15" fill="currentColor">${sgn(k)}</text>`;
  const xa = a === null ? x0 - 12 : X(a), xb = b === null ? x1 + 12 : X(b);
  s += `<line x1="${xa}" y1="38" x2="${xb}" y2="38" stroke="var(--accent)" stroke-width="7"/>`;
  if (a === null) s += `<path d="M${x0 - 20} 38 l12 -8 v16z" fill="var(--accent)"/>`;
  if (b === null) s += `<path d="M${x1 + 20} 38 l-12 -8 v16z" fill="var(--accent)"/>`;
  const br = (x, left, incl) => { const open = (left && incl) || (!left && !incl) ? 1 : -1, d = 7 * open;
    return `<path d="M${x + d} 22 H${x} V54 H${x + d}" fill="none" stroke="var(--neg)" stroke-width="3.5"/>`; };
  if (a !== null) s += br(X(a), true, ai);
  if (b !== null) s += br(X(b), false, bi);
  return s + "</svg>";
}
function randIv() {
  const t = R(0, 5);
  if (t <= 3) { const a = R(-5, 2), b = R(a + 2, 5); return [a, R(0, 1) === 1, b, R(0, 1) === 1]; }
  if (t === 4) return [R(-4, 4), R(0, 1) === 1, null, false];
  return [null, false, R(-4, 4), R(0, 1) === 1];
}
function ineqHTML(a, ai, b, bi) {
  if (a === null) return `x ${bi ? "≤" : "&lt;"} ${sgn(b)}`;
  if (b === null) return `x ${ai ? "≥" : "&gt;"} ${sgn(a)}`;
  return `${sgn(a)} ${ai ? "≤" : "&lt;"} x ${bi ? "≤" : "&lt;"} ${sgn(b)}`;
}
function ivVariants(a, ai, b, bi) { // juiste + varianten met andere haakjes
  const out = [];
  if (a !== null && b !== null) for (const p of [true, false]) for (const q of [true, false]) out.push([a, p, b, q]);
  else if (a === null) out.push([null, false, b, true], [null, false, b, false], [b, true, null, false], [b, false, null, false]);
  else out.push([a, true, null, false], [a, false, null, false], [null, false, a, true], [null, false, a, false]);
  const key = v => v.join("|"), k0 = key([a, ai, b, bi]);
  return [[a, ai, b, bi], ...out.filter(v => key(v) !== k0)];
}

const GEN = {
  1: [
    () => { // rationaal of irrationaal
      const items = [
        () => { const n = pick([2, 3, 5, 6, 7, 8, 10, 11, 12, 13, 15]); return [SQ(n) + ` = ${fx(Math.sqrt(n), 6)}…`, 1, `√${n} is niet begrensd en niet repeterend`]; },
        () => { const n = pick([4, 9, 16, 25, 36, 49, 64, 81, 100]); return [SQ(n), 0, `√${n} = ${Math.sqrt(n)}: een natuurlijk getal`]; },
        () => [`π = 3,14159265…`, 1, "π is niet begrensd en niet repeterend"],
        () => { const d = pick([3, 6, 7, 9, 11, 12]); let n; do { n = R(1, 2 * d); } while (gcd(n, d) !== 1); return [F(n, d), 0, "een breuk is altijd rationaal (begrensd of repeterend)"]; },
        () => { const s = pick(["0,4545…", "1,333…", "2,1666…", "0,121212…", "3,0909…"]); return [s, 0, "repeterend → rationaal"]; },
        () => { const s = pick(["0,125", "2,75", "−0,6", "4,05"]); return [s, 0, "begrensd → rationaal"]; },
      ];
      const [g, k, why] = pick(items)();
      return qMC(1, `Is dit getal rationaal of irrationaal?<div class="big">${g}</div>`, ["rationaal (ℚ)", "irrationaal (ℝ \\ ℚ)"], k, `${["rationaal (ℚ)", "irrationaal (ℝ \\ ℚ)"][k]}: ${why}`, TIP(1));
    },
    () => { // kleinste verzameling
      const items = [
        () => [String(R(1, 30)), 0], () => [SQ(pick([4, 9, 25, 49, 81])), 0], () => [sgn(-R(1, 20)), 1],
        () => [pick(["0,75", "−2,5", "1,333…"]), 2], () => { const d = pick([3, 4, 5, 7]); return [F(-R(1, d - 1), d), 2]; },
        () => [pick(["π", SQ(pick([2, 3, 5, 7, 10]))]), 3]];
      const [g, k] = pick(items)();
      const names = ["ℕ", "ℤ", "ℚ", "ℝ \\ ℚ"];
      return qMC(1, `Tot welke <b>kleinste</b> verzameling behoort dit getal?<div class="big">${g}</div>`, names, k, `${g} → ${names[k]}`, TIP(1));
    },
  ],
  2: [
    () => { // gekende derdemachtswortel
      const r = pick([1, 2, 3, 4, 5, 10]) * (R(0, 2) === 0 ? -1 : 1), n = r ** 3;

    () => { // omvormen MC
      const items = [
        [`v = ${Fraw("s", "t")}`, "t", Fraw("s", "v"), ["v · s", Fraw("v", "s"), "s − v"]],
        [`v = ${Fraw("s", "t")}`, "s", "v · t", [Fraw("v", "t"), Fraw("t", "v"), "v + t"]],
        [`P = ${Fraw("F", "A")}`, "A", Fraw("F", "P"), ["F · P", Fraw("P", "F"), "F − P"]],
        [`ρ = ${Fraw("m", "V")}`, "m", "ρ · V", [Fraw("ρ", "V"), Fraw("V", "ρ"), "ρ + V"]],
        ["F = m · g", "m", Fraw("F", "g"), ["F · g", Fraw("g", "F"), "F − g"]],
        ["K = k + I", "I", "K − k", ["k − K", "K + k", Fraw("K", "k")]],
        ["A = z²", "z", SQ("A"), [Fraw("A", 2), pw("A", 2), "2A"]],
        ["V = z³", "z", RT("V", 3), [Fraw("V", 3), pw("V", 3), SQ("V")]],
        ["O = 4z", "z", Fraw("O", 4), ["4O", "O − 4", Fraw(4, "O")]],
        [`A = ${Fraw("b · h", 2)}`, "h", Fraw("2A", "b"), [Fraw("A", "2b"), "2A · b", Fraw("b", "2A")]],
        ["O = 2 · r · π", "r", Fraw("O", "2π"), ["2πO", Fraw("2π", "O"), "O − 2π"]],
        ["A = r² · π", "r", SQ(Fraw("A", "π")), [Fraw("A", "π"), SQ("A · π"), Fraw(SQ("A"), 2)]],
        ["O = 2b + 2l", "l", Fraw("O − 2b", 2), ["O − 2b", Fraw("O", 2) + " − 2b", Fraw("O + 2b", 2)]],
      ];
      const [f, v, good, wrong] = pick(items);
      return qMCu(10, `Vorm <b>${f}</b> om naar <b>${v}</b>.`, `${v} = ${good}`, wrong.map(w => `${v} = ${w}`), `${v} = ${good}`, TIP(10));
    },
    () => { // toepassing
      const t = R(0, 4);
      if (t === 0) { const v = pick([12, 15, 18, 20, 24]), tt = pick([0.5, 1.5, 2, 2.5, 3]), s = v * tt;
        return qNum(10, `Een fietser rijdt ${com(s)} km aan ${v} km/u. Hoe lang (in uur) is hij onderweg?`, tt, `v = ${Fraw("s", "t")} → t = ${Fraw("s", "v")} = ${Fraw(com(s), v)} = ${com(tt)} uur`, TIP(10)); }
      if (t === 1) { const P = pick([500, 1000, 1500, 2000, 2500]), A = pick([0.2, 0.4, 0.5, 0.8, 2]), F_ = P * A;
        return qNum(10, `Een kracht van ${com(F_)} N geeft een druk van ${P} Pa. Bereken de oppervlakte in m².`, A, `P = ${Fraw("F", "A")} → A = ${Fraw("F", "P")} = ${Fraw(com(F_), P)} = ${com(A)} m²`, TIP(10)); }
      if (t === 2) { const z = pick([3, 4, 5, 6, 7, 8, 9, 12, 2.5, 7.5]);
        return qNum(10, `Een vierkant heeft een oppervlakte van ${com(z * z)} cm². Hoe lang is een zijde (in cm)?`, z, `A = z² → z = ${SQ("A")} = ${SQ(com(z * z))} = ${com(z)} cm`, TIP(10)); }
      if (t === 3) { const z = R(2, 10);
        return qNum(10, `Een kubus heeft een volume van ${z ** 3} cm³. Hoe lang is een ribbe (in cm)?`, z, `V = z³ → z = ${RT("V", 3)} = ${RT(z ** 3, 3)} = ${z} cm`, TIP(10)); }
      const O = R(20, 80), r = O / (2 * Math.PI);
      return qNum(10, `Een cirkel heeft een omtrek van ${O} cm. Bereken de straal op 2 decimalen (in cm).`, r, `O = 2·r·π → r = ${Fraw("O", "2π")} = ${Fraw(O, "2π")} ≈ ${fx(r, 2)} cm`, TIP(10), 2);
    },
  ],
};
function makeQ(sec) { return pick(GEN[sec])(); }

/* ===== Gedeelde vraag-weergave ===== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
/* toont vraag q in el; roept done(ok) op na "Volgende" */
function askQuestion(el, q, done, label = "") {
  el.innerHTML = `<div class="card">
    ${label ? `<div class="eyebrow">${label}</div>` : ""}
    <div class="qtext">${q.q}</div>
    ${q.kind === "mc" ? `<div class="mc">${q.opts.map((o, i) => `<button data-i="${i}">${o}</button>`).join("")}</div>`
      : `<form class="answer" autocomplete="off"><input inputmode="text" aria-label="Jouw antwoord">${q.unit ? `<span class="unit">${q.unit}</span>` : ""}<button class="btn" type="submit">Controleer</button></form><div class="hint">${q.hint}</div>`}
    <div class="fbslot"></div></div>`;
  const slot = $(".fbslot", el);
  let answered = false;
  function finish(res) {
    if (answered) return; answered = true;
    slot.innerHTML = `<div class="fb ${res.ok ? "ok" : "no"}">
      <b>${res.ok ? pick(["Juist!", "Knap!", "Helemaal goed!", "Prima!"]) : (res.msg ? "Bijna… " + esc(res.msg) : "Niet juist.")}</b>
      ${res.ok ? "" : `<div class="sol">Oplossing: ${q.sol}</div><div class="tip">💡 ${esc(q.tip)}</div>`}
      <div class="row"><button class="btn next" type="button">Volgende ›</button></div></div>`;
    const nb = $(".next", slot); nb.focus(); nb.onclick = () => done(res.ok);
  }
  if (q.kind === "mc") {
    el.querySelectorAll(".mc button").forEach(b => b.onclick = () => {
      if (answered) return; const i = +b.dataset.i, res = q.check(i);
      el.querySelectorAll(".mc button").forEach(x => { x.disabled = true; if (+x.dataset.i === q.correctIdx) x.classList.add("good"); });
      if (!res.ok) b.classList.add("bad"); finish(res);
    });
  } else {
    const f = $("form", el), inp = $("input", el); inp.focus();
    f.onsubmit = e => { e.preventDefault(); if (answered) return; if (!inp.value.trim()) { inp.focus(); return; }
      const res = q.check(inp.value);
      if (!res.ok && res.msg && /Typ /.test(res.msg)) { $(".hint", el).innerHTML = `<b style="color:var(--neg)">${esc(res.msg)}</b>`; return; }
      inp.disabled = true; $("button", f).disabled = true; finish(res); };
  }
}

/* ===== Expeditie ℝ ===== */
const KEY = "expeditie-r-v1", PER = 5, NEED = 4;
let S = store.get(KEY, { name: "", best: 0, runs: 0, wins: 0 });
const save = () => store.set(KEY, S);
const app = $("#app");
let run = null; // {level, qs:[], i, good, marks:[]}

function pathHTML(cur) {
  return `<div class="path">${SECTIONS.map(s => {
    const st = s.id < cur ? "done" : s.id === cur ? "cur" : "lock";
    return `<div class="step ${st}" title="${esc(s.t)}"><span>${s.id}</span><small>${esc(s.t)}</small></div>`; }).join("")}</div>`;
}
function start() {
  app.innerHTML = `<div class="hero card"><div class="eyebrow">Wiskunde 7VJHO · Reële getallen</div>
    <h1>Expeditie <span class="q">ℝ</span></h1>
    <p class="muted">Doorloop alle ${SECTIONS.length} delen van de reële getallen, in de volgorde van de cursus. Per deel krijg je ${PER} vragen: haal er minstens ${NEED} juist om door te gaan.
    <b>Mis je een deel, dan start je opnieuw bij deel 1.</b> Zo herhaal je alles telkens opnieuw.</p>
    <div class="field"><label for="nm"><b>Jouw naam</b></label><input id="nm" maxlength="30" value="${esc(S.name)}" placeholder="Voornaam"></div>
    <div class="row"><button class="btn gold" id="go">Start de expeditie</button></div>
    <p class="muted">Record: <b>${S.best >= SECTIONS.length ? "volledige expeditie voltooid 🏆" : S.best ? "deel " + S.best + " bereikt" : "nog geen"}</b> · pogingen: ${S.runs} · voltooid: ${S.wins}</p></div>
    <div class="card"><div class="eyebrow">Het parcours</div>${pathHTML(0)}</div>`;
  $("#go").onclick = () => { S.name = $("#nm").value.trim(); S.runs++; save(); intro(1); };
}
function intro(level) {
  const s = SECTIONS[level - 1];
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><div class="eyebrow">${esc(S.name || "Ontdekker")} · deel ${level} van ${SECTIONS.length}</div><div class="eyebrow">record: deel ${Math.max(S.best, 0)}</div></div>${pathHTML(level)}</div>
    <div class="card"><div class="eyebrow">Deel ${level}</div><h2>${esc(s.t)}</h2><p class="muted" style="margin:6px 0 12px">${esc(s.s)}</p>
    <div class="tipbox"><b>Onthoud</b><br>${esc(s.tip)}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="go">Start deel ${level}</button></div></div>`;
  $("#go").onclick = () => { run = { level, i: 0, good: 0, marks: [] }; next(); };
  $("#go").focus();
}
function next() {
  if (run.i >= PER) return result();
  const q = makeQ(run.level);
  app.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><b>Deel ${run.level}: ${esc(SECTIONS[run.level - 1].t)}</b>
    <div class="dots">${Array.from({ length: PER }, (_, i) => `<span class="${run.marks[i] === undefined ? "" : run.marks[i] ? "ok" : "no"}"></span>`).join("")}</div></div></div><div id="qa"></div>`;
  askQuestion($("#qa"), q, ok => { run.marks.push(ok); if (ok) run.good++; run.i++;
    if (run.i - run.good > PER - NEED) return result(); next(); }, `Vraag ${run.i + 1} van ${PER}`);
}
function result() {
  const L = run.level;
  if (run.good >= NEED || (run.i >= PER && run.good >= NEED)) {
    if (L > S.best) S.best = L; save();
    if (L === SECTIONS.length) return win();
    app.innerHTML = `<div class="card"><h2>Deel ${L} geslaagd! 🎉</h2><p style="margin:8px 0 14px">Je had ${run.good} van de ${run.i} juist. Op naar deel ${L + 1}: <b>${esc(SECTIONS[L].t)}</b>.</p>
      <button class="btn" id="go">Verder naar deel ${L + 1} ›</button></div>`;
    $("#go").onclick = () => intro(L + 1); $("#go").focus();
  } else {
    app.innerHTML = `<div class="card"><h2>Terug naar deel 1 …</h2><p style="margin:8px 0 6px">Je had ${run.good} juist in deel ${L} (${esc(SECTIONS[L - 1].t)}). Je hebt er minstens ${NEED} van de ${PER} nodig.</p>
      <p class="muted" style="margin-bottom:14px">Geen paniek: zo herhaal je alles nog eens. Je verste deel tot nu toe: deel ${S.best || L}.</p>
      <div class="row"><button class="btn gold" id="go">Opnieuw vanaf deel 1</button><button class="btn ghost" id="home">Naar het begin</button></div></div>`;
    $("#go").onclick = () => { S.runs++; save(); intro(1); }; $("#home").onclick = start; $("#go").focus();
  }
}
function win() {
  S.wins++; S.best = SECTIONS.length; save();
  app.innerHTML = `<div class="card hero"><div class="eyebrow">Expeditie voltooid</div><h1>Proficiat${S.name ? ", " + esc(S.name) : ""}! 🏆</h1>
    <p style="margin:10px 0">Je hebt alle ${SECTIONS.length} delen van de reële getallen in één keer doorlopen. Toon dit scherm aan je leerkracht.</p>
    <p class="muted">${new Date().toLocaleString("nl-BE")}</p>
    <div class="row" style="margin-top:14px"><button class="btn" id="go">Nog een expeditie</button></div></div>
    <div class="card">${pathHTML(SECTIONS.length + 1)}</div>`;
  $("#go").onclick = () => { S.runs++; save(); intro(1); };
}
start();


</script>
</body>
